[tasks."zsh:plugins:update"]
description = "Re-pin zsh plugins in .chezmoiexternal.toml to upstream HEAD"
run = '''
set -e
source_dir="$(chezmoi source-path)"
external_file="$source_dir/.chezmoiexternal.toml"
grep -oE 'https://github.com/[^/]+/[^/]+/archive/[0-9a-f]{40}' "$external_file" | while read -r archive_url; do
  repo_path="${archive_url#https://github.com/}"
  repo_path="${repo_path%/archive/*}"
  pinned_sha="${archive_url##*/}"
  latest_sha="$(git ls-remote "https://github.com/$repo_path" HEAD | cut -f1)"
  [ -n "$latest_sha" ] || { echo "$repo_path: could not resolve HEAD" >&2; exit 1; }
  if [ "$pinned_sha" = "$latest_sha" ]; then
    echo "$repo_path up to date"
  else
    sed -i.bak "s/$pinned_sha/$latest_sha/" "$external_file" && rm "$external_file.bak"
    echo "$repo_path $(printf %.7s "$pinned_sha") -> $(printf %.7s "$latest_sha")"
  fi
done
chezmoi apply "$HOME/.zsh/plugins"
if ! git -C "$source_dir" diff --quiet -- .chezmoiexternal.toml; then
  git -C "$source_dir" commit -qm "Update zsh plugins" -- .chezmoiexternal.toml
  git -C "$source_dir" push -q
fi
'''

[tasks."zsh:completions:update"]
description = "Regenerate cached zsh completions in ~/.config/completions"
run = '''
completions_dir="${XDG_CONFIG_HOME:-$HOME/.config}/completions"
mkdir -p "$completions_dir"
failed=0
expected_files=" _espanso "
while read -r tool_name generate_command; do
  expected_files="${expected_files}_${tool_name} "
  if ! command -v "$tool_name" >/dev/null; then
    echo "$tool_name not installed, skipping"
    continue
  fi
  target_file="$completions_dir/_$tool_name"
  if error_output="$(bash -c "set -eo pipefail; $generate_command" 2>&1 >"$target_file.tmp" </dev/null)" && [ -s "$target_file.tmp" ]; then
    mv "$target_file.tmp" "$target_file"
    echo "$tool_name ok"
  else
    rm -f "$target_file.tmp"
    echo "$tool_name failed${error_output:+: $error_output}" >&2
    failed=1
  fi
done <<'TOOLS'
kubectl kubectl completion zsh
helm helm completion zsh
gh gh completion -s zsh
docker docker completion zsh
yq yq shell-completion zsh
delta delta --generate-completion zsh
mise mise completion zsh
chezmoi chezmoi completion zsh
just just --completions zsh
uv uv generate-shell-completion zsh
rg rg --generate complete-zsh
fd fd --gen-completions zsh
bat bat --completion zsh
starship starship completions zsh
atuin atuin gen-completions --shell zsh
glow glow completion zsh
npm printf '#compdef npm\n'; npm completion; printf '_npm_completion "$@"\n'
pnpm printf '#compdef pnpm pn\n'; pnpm completion zsh | grep -v '^#compdef'; printf '_pnpm_completion "$@"\n'
TOOLS
if command -v espanso >/dev/null; then
  cat >"$completions_dir/_espanso.tmp" <<'ESPANSO'
#compdef espanso
local -a espanso_triggers
case $CURRENT in
  2) compadd match ;;
  3) [[ ${words[2]} == match ]] && compadd exec ;;
  4) [[ ${words[2]} == match && ${words[3]} == exec ]] && compadd -- -t --trigger ;;
  5)
    [[ ${words[2]} == match && ${words[3]} == exec && ${words[4]} == (-t|--trigger) ]] || return 1
    espanso_triggers=(${${(f)"$(espanso match list 2>/dev/null)"}/ - /:})
    _describe 'espanso trigger' espanso_triggers
    ;;
esac
ESPANSO
  mv "$completions_dir/_espanso.tmp" "$completions_dir/_espanso"
  echo "espanso ok"
else
  echo "espanso not installed, skipping"
fi
for completion_file in "$completions_dir"/_*; do
  [ -e "$completion_file" ] || continue
  case "$expected_files" in
    *" ${completion_file##*/} "*) ;;
    *) rm -f "$completion_file" && echo "${completion_file##*/} removed" ;;
  esac
done
zsh -ic compdump </dev/null 2>&1 | { grep -v "can't change option: zle" >&2 || true; }
exit $failed
'''

[tasks."setup:nvim"]
description = "Set up nvim end to end via ~/.config/nvim/mise.toml"
run = '''
set -e
nvim_config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/nvim"
mise trust "$nvim_config_dir/mise.toml"
mise -C "$nvim_config_dir" run setup
'''

[tasks."tmux:layout"]
description = "Set up the tmux windows: util, console, admin, 1c, exec"
run = '''
set -e
session_name="${TMUX:+$(tmux display-message -p '#S')}"
session_name="${session_name:-ghost}"
tmux has-session -t "$session_name" 2>/dev/null || tmux new-session -d -s "$session_name"
digest_dir="${GHQ_ROOT:-$HOME/Projects}/github.com/achandrapaul/digest"
projects_dir="$HOME/Projects"
util_window="$session_name:^"
window_exists() {
  tmux list-windows -t "$session_name" -F '#{window_name}' | grep -qx "$1"
}
if ! window_exists util; then
  tmux rename-window -t "$util_window" util
  tmux send-keys -t "$util_window" "cd '$digest_dir' && clear" Enter
fi
util_panes="$(tmux list-panes -t "$session_name:util" | wc -l | tr -d ' ')"
if [ "$util_panes" -eq 1 ]; then
  tmux split-window -h -t "$session_name:util" -c "$digest_dir" digest
  tmux select-pane -t "$session_name:util" -L
fi
for window_name in console admin 1c exec; do
  window_exists "$window_name" || tmux new-window -d -a -t "$session_name:$" -n "$window_name" -c "$projects_dir"
done
'''
