matches:
  - trigger: "*helloPrompt"
    replace: "Hello, how can I assist you today?"

  - trigger: "*ml"
    replace: me@anudeep.pro

  - trigger: "*fn"
    replace: () => { }

  - trigger: "*ee"
    replace: "espanso edit"

  - trigger: "*gsc"
    replace: "git switch -c FUE-$|$"

  - trigger: "*gss"
    replace: "git switch "

  - trigger: "*gU"
    replace: "git push --set-upstream origin FUE-$|$"

  - trigger: "*gP"
    replace: "git push origin "

  - trigger: "*gfU"
    replace: "git push --set-upstream origin FUE-$|$ --force"

  - trigger: "*gpr"
    replace: "git pull --rebase origin "

  - trigger: "*gpp"
    replace: "git pull origin "

  - trigger: "*gfp"
    replace: "git fetch; git pull"

  - trigger: "*gfr"
    replace: "git fetch origin; git pull --rebase origin "

  - trigger: "*gc"
    replace: git commit -m "FUE-$|$"

  - trigger: "*dU"
    replace: "db push --set-upstream origin "

  - trigger: "*dP"
    replace: "db push origin main"

  - trigger: "*dp"
    replace: "db pull --rebase origin "

  - trigger: "*df"
    replace: "db fetch origin; git pull --rebase origin "

  - trigger: "*dc"
    replace: db commit -m "FUE-$|$"

  - trigger: "*tq"

    replace: telepresence quit

  - trigger: "*ts"
    replace: telepresence

  - trigger: "*ll"
    replace: "{{mytime}} — #log"
    vars:
      - name: mytime
        type: date
        params:
          format: "%d-%B-%Y"
          offset: 0
          locale: en_IN

  - trigger: "*tt"
    replace: "{{mytime}} —> "
    vars:
      - name: mytime
        type: date
        params:
          format: "%H:%M"
          offset: 0
          locale: en_IN

  - trigger: "*ws"
    replace: "curl wttr.in"

  - trigger: "*ip"
    replace: "curl ifconfig.me"

  - trigger: "*dj"
    replace: 'curl -H "Accept: text/plain" https://icanhazdadjoke.com; echo'

  - trigger: "*hl"
    replace: "atuin login -u achandrapaul"

  - trigger: "*hs"
    replace: "atuin sync"

  - trigger: "*nu"
    replace: "nvm use"

  - trigger: "*nd"
    replace: "nvm use default"

  - trigger: "*yns"
    replace: 'yarn; NODE_OPTIONS="--max-old-space-size=12192" yarn start'

  - trigger: "*ys"
    replace: "yarn; yarn start"

  - trigger: "*rc"
    replace: |
      import React from "react";

      type {{x.name}}Props = {
        $|$
      };

      const {{x.name}}: React.FC<{{x.name}}Props> = ({}) => {
        return (
          <div>
            {{x.name}} component
          </div>
        );
      };

      export default {{x.name}};
    vars:
      - name: x
        type: form
        params:
          layout: "Component Name: [[name]]"
  - trigger: "*cp"
    replace: pwd | pbcopy

  - trigger: "*hrl"
    replace: 'hs -c "hs.reload()"'

  - trigger: "*rg"
    replace: "rg --column --line-number --no-heading --color=always --smart-case --ignore-file ~/.rgignore "

  - trigger: "*pv"
    replace: "python3 -m venv ./venv"

  - trigger: "*glsm"
    replace: "git ls-files --modified --others --exclude-standard"

  - trigger: "*gds"
    replace: "git diff --staged"

  - trigger: "*clone"
    replace: "git clone "

  - trigger: "*conf"
    replace: "sudo nvim -O ~/.zprofile ~/.zshrc"

  - trigger: "*px"
    replace: "pnpm dlx "

  - trigger: "*news"
    replace: "curl hkkr.in"

  - trigger: "*wq"
    replace: "curl 'wttr.in?format=3'"

  - trigger: "*tks"
    replace: "tmux kill-session -t "

  - trigger: "*tka"
    replace: "tmux kill-server"

  - trigger: "*dke"
    replace: "docker exec -u root -it "

  - trigger: "*dkli"
    replace: "docker image ls"

  - trigger: "*dklv"
    replace: "docker volume ls"

  - trigger: "*dklc"
    replace: "docker container ls"

  - trigger: "*dkln"
    replace: "docker network ls"

  - trigger: "*dkxi"
    replace: "docker image rm "

  - trigger: "*dkxv"
    replace: "docker volume rm "

  - trigger: "*dkxc"
    replace: "docker container rm "

  - trigger: "*dkxn"
    replace: "docker network rm "

  - trigger: "*dkri"
    replace: "docker image rm $(docker image ls -q)"

  - trigger: "*dkrv"
    replace: "docker volume rm $(docker volume ls -q)"

  - trigger: "*dkrc"
    replace: "docker container rm $(docker container ls -q)"

  - trigger: "*dkrn"
    replace: "docker network rm $(docker network ls -q)"

  - trigger: "*esr"
    replace: "espanso restart"

  - trigger: "*af"
    replace: "ack -il "

  - trigger: "*ack"
    replace: "ack --sort-files --color "

  - trigger: "*unbrew"
    replace: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/uninstall.sh)"'

  - trigger: "*nvrm"
    replace: "rm -rf ~/.local/share/nvim ~/.local/state/nvim"

  - trigger: "*xcs"
    replace: "sudo xcode-select --switch /Applications/Xcode.app"

  - trigger: "*pid"
    replace: "ps -ef | grep -v grep | grep -i \"$|$\" | awk '{print $2}'"

  - trigger: "*stat"
    replace: 'stat -f "%N -%z -%R" '

  - trigger: "*ide"
    replace: "tmux split-window -v -p 30; tmux split-window -h -p 40"

  - trigger: "*dkclean"
    replace: "docker info && docker compose down && docker container prune --force && docker image prune --all --force && docker volume prune --force"
